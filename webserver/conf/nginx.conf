user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 4096;
}

http {

  # GZIP Settings
  gzip on;
  gzip_vary on;
  gzip_min_length 10240;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript application/x-json;
  gzip_disable "MSIE [1-6]\.";

  # Security Headers
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header X-XSS-Protection "1; mode=block";
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self';";

  # SSL Settings
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

  # Include configurations
  include /etc/nginx/conf.d/*.conf;
  include /etc/nginx/sites-enabled/*;

  upstream auth_service {
    server auth:3001;
  }

  upstream product_service {
    server product:3002;
  }

  upstream order_service {
    server order:3003;
  }

  upstream user_service {
    server user:3005;
  }

  # HTTP server block (port 80)
  server {
    listen 80;
    server_name api.eden.local;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
  }

  include mime.types;
  default_type application/octet-stream;


  sendfile on;
  keepalive_timeout 65;

  # HTTPS server block (port 443)
  server {
    listen 443 ssl;

    server_name api.eden.local;

    ssl_certificate /etc/nginx/ssl/api-gateway.crt;
    ssl_certificate_key /etc/nginx/ssl/api-gateway.key;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # =================AUTH ROUTE===============================
    location /api/auth {
      proxy_pass http://auth_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https; # Ensure HTTPS is used
    }

    location /account {
      proxy_pass http://auth_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https; # Ensure HTTPS is used
    }
    # =================END AUTH ROUTE===============================

    # =================USER ROUTE===============================
    location /api/users {
      proxy_pass http://user_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https; # Ensure HTTPS is used
    }

    location /api/admins {
      proxy_pass http://user_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https; # Ensure HTTPS is used
    }

    location /api/upload {
      proxy_pass http://user_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https; # Ensure HTTPS is used
    }

    location /api/delete {
      proxy_pass http://user_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https; # Ensure HTTPS is used
    }
    # =================END USER ROUTE===============================

    # =================ORDER ROUTE===============================
    location /api/orders {
      proxy_pass http://order_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https; # Ensure HTTPS is used
    }
    # =================END ORDER ROUTE===============================

    # =================PRODUCT ROUTE===============================
    location /api/kids {
      proxy_pass http://product_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https; # Ensure HTTPS is used
    }

    location /api/men/ {
      proxy_pass http://product_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https; # Ensure HTTPS is used
    }

    location /api/products {
      proxy_pass http://product_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https; # Ensure HTTPS is used
    }

    location /api/women {
      proxy_pass http://product_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https; # Ensure HTTPS is used
    }

    location /api/stats {
      proxy_pass http://product_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https; # Ensure HTTPS is used
    }
    # =================ENDPRODUCT ROUTE===============================

    location / {
      return 404;
    }
  }
}